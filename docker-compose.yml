services:
  db:
    image: postgres:16-alpine
    container_name: optiplan_db
    environment:
      POSTGRES_USER: ${DB_USER:-optiplan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-optiplan_secret}
      POSTGRES_DB: ${DB_NAME:-optiplan_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-optiplan} -d ${DB_NAME:-optiplan_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optiplan_app
    env_file:
      - .env.example
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
