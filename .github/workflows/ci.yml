name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: optiplan
          POSTGRES_PASSWORD: optiplan_secret
          POSTGRES_DB: optiplan_db
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: optiplan
      DB_PASSWORD: optiplan_secret
      DB_NAME: optiplan_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      - name: Lint and format check
        run: ruff check . && ruff format --check .

      - name: Run unit tests
        run: pytest --cov=app --cov-report=xml --cov-fail-under=70

      - name: Build Docker image
        run: docker build -t optiplan-app:ci .
